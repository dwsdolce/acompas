#
# The Java version this build's Gradle daemon runs on, stated once and tracked.
#
# Without it the JDK is chosen per machine and recorded nowhere: it lives in
# .gradle/config.properties, which is gitignored, so every clone has to be told
# again and Android Studio guesses its own bundled runtime until someone does.
# That guess is wrong - current Studio bundles JBR 25, and Gradle 8.13 does not
# support it, so Studio refuses to sync with a message about needing a different
# JVM and nothing points at the cause.
#
# A version and no vendor. Any vendor's JDK 21 satisfies this, which matters
# because the machines that build this do not agree: Adoptium on Windows,
# whatever Homebrew or Apple put on the Mac. Pinning a vendor would turn a
# working machine into a broken one for no benefit.
#
# There are deliberately no toolchain download URLs, which is why this file is
# written by hand rather than by `gradlew updateDaemonJvm` - that task refuses
# to run without download repositories configured, and configuring them means
# adding a resolver plugin and letting Gradle fetch a JDK by itself. A JDK is
# step 1 of the setup this project documents; a build that silently downloads
# one instead would contradict that. Without a matching JDK installed, Gradle
# says so and stops, which is the failure you want.
#
toolchainVersion=21
