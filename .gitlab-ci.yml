stages:
  - build
#  - staging
#  - production

variables:
  ANDROID_HOME: "/www/android/android-sdk-linux"
  JAVA_HOME: "/usr/lib/jvm/java-8-oracle"

# Jobs

build_job:
  script:
    - bower install
    - ./sync_assets.sh
    - crosswalk-pkg --targets="arm x86 arm_64 x86_64" -c stable ./crosswalk/
  stage: build
