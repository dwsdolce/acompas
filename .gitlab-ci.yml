stages:
  - build

variables:
  YARN: "yarn --cache-folder /tmp/yarn-cache"
  DEBIAN_FRONTEND: "noninteractive"
  ANDROID_SDK_ROOT: "/android-sdk"
  ANDROID_HOME: "/android-sdk"
  ANDROID_SDK_HOME: "/root"
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

# Jobs

test_web_job:
  script:
    - ln -fs /usr/share/zoneinfo/Europe/Paris /etc/localtime
    - apt-get -y -qq update
    - apt-get -y -qq dist-upgrade
    - apt-get -y -qq install curl gnupg
    - curl -fsSL https://deb.nodesource.com/setup_20.x -o /tmp/nodesource_setup.sh
    - bash /tmp/nodesource_setup.sh
    - apt-get -y -qq update
    # Some deps are for Cypress.
    # See https://docs.cypress.io/guides/guides/continuous-integration.html#Advanced-setup
    - apt-get install -y -qq nodejs git make g++ gcc rsync xvfb libgtk-3-dev libnotify-dev libnss3 libxss1
    - npm install -g @quasar/cli
    - npm install -g --unsafe-perm @quasar/icongenie
    # SPA
    - ./icongenie.sh
    # Enable yarn
    - corepack enable
    - $YARN install
    - quasar build
    - (cd dist && tar cvzf spa.tar.gz spa)
    # Install openjdk 17
    - apt -y -qq install openjdk-17-jdk openjdk-17-jre
    # Install required apt-utils package (to avoid 'debconf: delaying package configuration, since apt-utils is not installed' while installing android packages from google)
    - apt -y -qq install apt-utils
    # Install android packages from google
    - apt -y -qq install google-android-cmdline-tools-13.0-installer google-android-build-tools-30.0.3-installer google-android-build-tools-34.0.0-installer google-android-licenses google-android-tools-installer google-android-platform-tools-installer google-android-platform-33-installer google-android-platform-34-installer
    - (cd src-capacitor && $YARN install)
    - mkdir $ANDROID_HOME
    # Install required android packages
    # - ((yes | sdkmanager --install tools) || exit 0)
    # - ((yes | sdkmanager --install emulator) || exit 0)
    # - ((yes | sdkmanager --install platform-tools) || exit 0)
    # - ((yes | sdkmanager --install 'build-tools;30.0.3') || exit 0)
    # This must be the same as in src-capacitor/android/app/build.gradle (targetSdkVersion)
    # - ((yes | sdkmanager --install 'platforms;android-34') || exit 0)
    # No idea why, this is required at the moment
    # - ((yes | sdkmanager --install 'platforms;android-33') || exit 0)
    - ((yes | sdkmanager --licenses) || exit 0)
    - sdkmanager update
    - quasar build -m capacitor -T android

  stage: build
  tags:
    - amd64
  image: ubuntu:noble
  artifacts:
    paths:
      - dist/capacitor/android/apk/release/app-release-unsigned.apk
      - dist/spa.tar.gz
    expire_in: 6 mos
#  artifacts:
#    paths:
#      - test/cypress/screenshots
#      - test/cypress/videos
#    expire_in: 6 mos
