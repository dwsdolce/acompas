stages:
  - build

variables:
  YARN: "yarn --cache-folder /tmp/yarn-cache"
  DEBIAN_FRONTEND: "noninteractive"
  ANDROID_SDK_ROOT: "/android-sdk"
  ANDROID_HOME: "/android-sdk"
  ANDROID_SDK_HOME: "/root"
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

# Jobs

test_web_job:
  script:
    - ln -fs /usr/share/zoneinfo/Europe/Paris /etc/localtime
    - apt-get -y -qq update
    - apt-get -y -qq dist-upgrade
    - apt-get -y -qq install curl gnupg
    - curl -sL https://deb.nodesource.com/setup_20.x | bash -
    - curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg | apt-key add -
    - echo "deb https://dl.yarnpkg.com/debian/ stable main" | tee /etc/apt/sources.list.d/yarn.list
    - apt-get update
    # Some deps are for Cypress.
    # See https://docs.cypress.io/guides/guides/continuous-integration.html#Advanced-setup
    - apt-get install -y -qq nodejs git make g++ gcc rsync yarn xvfb libgtk-3-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2
    - npm install -g @quasar/cli
    - npm install -g --unsafe-perm @quasar/icongenie
    - ./icongenie.sh
    - $YARN install
    - quasar build
    - apt -y -qq install openjdk-17-jdk openjdk-17-jre sdkmanager
    - (cd src-capacitor && $YARN install && icongenie generate -m capacitor -i ./app-icon.png)
    - mkdir $ANDROID_HOME
    - sdkmanager --install tools
    - sdkmanager --install platform-tools
    - sdkmanager --install 'build-tools;30.0.3'
    - sdkmanager --install 'platforms;android-33'
    - echo yes | sdkmanager --licenses
    - quasar build -m capacitor -T android

  stage: build
  tags:
    - amd64
  image: ubuntu:jammy
#  artifacts:
#    paths:
#      - test/cypress/screenshots
#      - test/cypress/videos
#    expire_in: 6 mos
