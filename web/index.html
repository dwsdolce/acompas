    <head>
        <title>A Compás - Flamenco metronome</title>

        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="A Compás is a web-based flamenco metronome, also available as an Android application. It will let you play various flamenco rhythms and change the tempo." />

        <link rel="stylesheet" href="common/css/material.min.css">
        <link rel="stylesheet" href="common/css/MaterialIcons.css">
        <link rel="stylesheet" href="common.css" />
        <link rel="shortcut icon" href="favicon.ico"/>
        <meta property="og:title" content="A Compás - Flamenco metronome" />
        <meta property="og:description" content="A Compás is a web-based flamenco metronome, also available as an Android application. It will let you play various flamenco rhythms and change the tempo." />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="http://acompas.audio" />
        <meta property="og:image" content="http://acompas.audio/images/icon_512x512.png" />
        <meta name="google-site-verification" content="eAk9WqewTUXR8axL9HotVs7j9hmQ85wGgt6i1OARKzY" />
    </head>

    <body>

        <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">

            <header class="mdl-layout__header">
                <div class="mdl-layout__header-row">
                    <!-- Title -->
                    <span class="mdl-layout-title">
                        <img id="app-logo" src="images/icon_96x96.png" alt="" />
                        <div id="app-title-container">
                            <span id="app-title">
                                A Compás
                            </span>
                            <span id="app-subtitle">
                                A flamenco metronome for the web
                            </span>
                        </div>
                    </span>
                </div>
            </header>
            <main class="mdl-layout__content">
                <div class="page-content">
                    <div id="main">
                    </div>
                </div>
            </main>

            <footer class="mdl-mini-footer">
                <div class="mdl-mini-footer__left-section">
                    <ul class="mdl-mini-footer__link-list">
                        <li>
                            <a target="_blank"
                                href="https://play.google.com/store/apps/details?id=audio.acompas.app"
                                title="Get A Compás for Android">
                                <img id="footer-google-play-img" src="images/en_badge_web_generic.png" alt="Get it on Google Play" />
                            </a>
                        </li>
                        <li>
                            <a target="_blank" class="footer-link"
                                href="https://gitlab.com/oricordeau/acompas">
                                Source code
                            </a>
                        </li>
                        <li>
                            <a target="_blank" class="footer-link"
                                href="https://gitlab.com/oricordeau/acompas/issues">
                                Issues
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="mdl-mini-footer__right-section">
                    <a href="https://www.facebook.com/sharer/sharer.php?u=http://acompas.audio"
                       target="_blank">
                        <img src="/images/3D-Icons/facebook.png"
                            alt="Share this page on Facebook"
                            class="share-img" />
                    </a>
                    <a href="https://twitter.com/share?url=http://acompas.audio"
                       target="_blank">
                       <img src="/images/3D-Icons/Twitter-2.png"
                            alt="Share this page on Twitter"
                            class="share-img" />
                    </a>
                    <a href="https://plus.google.com/share?url=http://acompas.audio"
                       target="_blank">
                       <img src="/images/3D-Icons/Google+.png"
                            alt="Share this page on Google+"
                            class="share-img" />
                    </a>
                </div>
            </footer>

        </div>

        <!-- Dialog which contains the instruments mixer -->
        <dialog id="mixer-dialog" class="mdl-dialog">
        </dialog>

        <!-- Dialog which is shown if user's browser can't run the application -->
        <dialog id="will-not-work-dialog" class="mdl-dialog">
            <h4 class="mdl-dialog__title">Requirements issue</h4>
            <div class="mdl-dialog__content">
                <p>
                    The web browser you are currently using does not meet the minimal
                    requirements needed to use this website.
                </p>
                <p>
                    Please use (for example) a recent version of
                    <a href="http://www.google.com/chrome">Google Chrome</a>
                    or <a href="http://getfirefox.com">Mozilla Firefox</a>.
                </p>
            </div>
            <div class="mdl-dialog__actions">
                <button type="button" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--accent close">
                    Ok
                </button>
            </div>
        </dialog>

        <script type="text/javascript" src="node_modules/material-design-lite/material.min.js"></script>
        <script type="text/javascript" src="node_modules/jquery/dist/jquery.min.js"></script>
        <script type="text/javascript" src="node_modules/jquery-mousewheel/jquery.mousewheel.js"></script>
        <script type="text/javascript" src="node_modules/startaudiocontext/StartAudioContext.js"></script>
        <script type="text/javascript" src="common/js/common.js"></script>
        <script type="text/javascript">

            $(document).ready(function() {
                initMetronome();
            });

        </script>

        <!-- Piwik -->
        <script type="text/javascript">
            var _paq = _paq || [];
            _paq.push(['setCustomVariable', 1, "AppVersion", "Website", "visit"]);
            _paq.push(['trackPageView']);
            _paq.push(['enableLinkTracking']);
            (function() {
                var u="//piwik.acompas.audio/";
                _paq.push(['setTrackerUrl', u+'piwik.php']);
                _paq.push(['setSiteId', 1]);
                var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
                g.type='text/javascript'; g.async=true; g.defer=true; g.src=u+'piwik.js'; s.parentNode.insertBefore(g,s);
            })();
       </script>
       <noscript><p><img src="//piwik.acompas.audio/piwik.php?idsite=1" style="border:0;" alt="" /></p></noscript>
       <!-- End Piwik Code -->
       <script type="application/ld+json">
            {
              "@context": "http://schema.org/",
              "@type": "WebApplication",
              "name": "A Compás",
              "browserRequirements": "Requires both HTML5 and Web Audio API support",
              "applicationCategory": "Music",
              "operatingSystem": "Any",
              "url": "http://acompas.audio",
              "image": "http://acompas.audio/images/icon_512x512.png",
              "description": "A Compás is a web-based flamenco metronome, also available as an Android application. It will let you play various flamenco rhythms and change the tempo, and features a graphical visualization and some options."
            }
        </script>

	</body>
</html>
