# nginx config for the A Compás SPA (Quasar, history routing mode).
# TLS is terminated by Traefik, so this server block is plain HTTP on :80.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly (audio/images are already compressed).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # Hashed build assets are immutable -> cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Long cache for static media that carry a stable name.
    location ~* \.(?:woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|mp3|mp4|ogg|flac|wav)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves index.html so Vue Router
    # (history mode) can handle client-side routes on a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or clients get stale bundles.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # A few sane security headers (adjust CSP to your needs if you add one).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
