<% if (ctx.prod) { %>
    <!--
      Production only. The dev server needs 'unsafe-eval' and inline scripts for
      Vite's hot reload, so applying this in development would break `quasar dev`
      rather than harden anything.

      Every directive here is what the app actually loads, not a template:

        script-src 'self' blob:
                               - one bundle, no CDN, no analytics. A production
                                 build needs no 'unsafe-eval'; only the dev
                                 server does.

                                 blob: is for Tone.js, which builds its
                                 AudioWorklet as a blob and loads it with
                                 addModule(). That counts as a script, not a
                                 worker, so worker-src does not cover it.
                                 Without it Android refused the worklet, the
                                 support probe failed, and the app greeted
                                 every user with "Update your browser!".
        style-src 'unsafe-inline'
                               - unavoidable. Vue writes inline style attributes,
                                 and this app leans on them: the beat dots set
                                 background-color per beat. Removing it needs
                                 nonces or hashes, which a static build cannot
                                 produce. This is the weakest line here.
        connect-src wikipedia  - the pattern help fetches article extracts, and
                                 wikipedia.ts builds a per-language host, hence
                                 the wildcard.
        media-src 'self'       - the audio samples.
        worker-src blob:       - the same blob worklet, for engines that police
                                 it as a worker rather than as a script. Android
                                 reported it under script-src; this is here so
                                 the policy does not depend on which.

      frame-ancestors, report-uri and sandbox are ignored in a meta tag and only
      work as HTTP headers; clickjacking protection needs one from the server.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' blob:;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      font-src 'self';
      media-src 'self';
      connect-src 'self' https://*.wikipedia.org;
      worker-src 'self' blob:;
      base-uri 'self';
      form-action 'self'
    "><% } %>
