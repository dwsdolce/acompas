    <meta property="og:title" content="A Compás - Flamenco metronome web / mobile app" />

    <meta property="og:type" content="website" />
    <!-- The www. form is canonical for this domain: the guitar_tap sitemap and
         the root robots.txt already use it, and both forms currently serve the
         same content. og:url points at the parent page rather than the app,
         since that is what a shared link should open. -->
    <meta property="og:url" content="https://www.dolcesfogato.com/acompas/" />
    <meta property="og:image" content="https://www.dolcesfogato.com/acompas/acompas_web/icons/favicon-128x128.png" />
