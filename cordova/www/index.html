    <head>
        <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">
        <meta charset="utf-8" />

        <link rel="stylesheet" href="common/css/material.min.css">
        <link rel="stylesheet" href="common/css/MaterialIcons.css">
        <link rel="stylesheet" href="common.css" />

        <title>A Compás</title>
    </head>
    <body>

        <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">

            <header class="mdl-layout__header">
                <div class="mdl-layout__header-row">
                    <!-- Title -->
                    <span class="mdl-layout-title">
                        <img id="app-logo" src="images/icon_96x96.png" alt="" />
                        <div id="app-title-container">
                            <span id="app-title">
                                A Compás
                            </span>
                            <span id="app-subtitle">
                                A flamenco metronome mobile app
                            </span>
                        </div>
                    </span>
                </div>
            </header>
            <main class="mdl-layout__content">
                <div class="page-content">
                    <div id="main">
                    </div>
                </div>
            </main>

        </div>

        <!-- Dialog which contains the instruments mixer -->
        <dialog id="mixer-dialog" class="mdl-dialog">
        </dialog>

        <!-- Dialog which is shown if user's browser can't run the application -->
        <dialog id="will-not-work-dialog" class="mdl-dialog">
            <h4 class="mdl-dialog__title">Requirements issue</h4>
            <div class="mdl-dialog__content">
                <p>
                    The version of the operating system you are currently
                    using does not meet the minimal
                    requirements needed to use this application.
                </p>
                <p>
                    Please try to update your device to have a chance to get
                    this application working.
                </p>
            </div>
            <div class="mdl-dialog__actions">
                <button type="button" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--accent close">
                    Ok
                </button>
            </div>
        </dialog>

        <script type="text/javascript" src="cordova.js"></script>

        <script type="text/javascript" src="node_modules/material-design-lite/material.min.js"></script>
        <script type="text/javascript" src="node_modules/jquery/dist/jquery.min.js"></script>
        <script type="text/javascript" src="node_modules/jquery-mousewheel/jquery.mousewheel.js"></script>
        <script type="text/javascript" src="node_modules/startaudiocontext/StartAudioContext.js"></script>
        <script type="text/javascript" src="common/js/common.js"></script>
        <script type="text/javascript">

            $(document).ready(function() {
                initMetronome();
            });

        </script>
        <!-- Piwik tracking code -->
        <script type="text/javascript">
            var _paq = _paq || [];
            _paq.push(['setCustomVariable', 1, "AppVersion", "Cordova", "visit"]);
            _paq.push(['trackPageView']);
            _paq.push(['enableLinkTracking']);
            var u="http://piwik.acompas.audio/";
            _paq.push(['setTrackerUrl', u+'piwik.php']);
            _paq.push(['setSiteId', 1]);
        </script>
        <script src="http://piwik.acompas.audio/piwik.js" defer="" async="" type="text/javascript"></script>
        <!-- End Piwik tracking code -->
    </body>
</html>
